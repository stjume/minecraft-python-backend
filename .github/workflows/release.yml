name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package -DskipTests

      - name: Locate shaded JAR
        id: jar
        run: |
          JAR=$(ls target/*.jar | grep -v original | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $JAR)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (retained for 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          retention-days: 90

      - name: Generate SHA-256 checksum
        run: sha256sum ${{ steps.jar.outputs.path }} > ${{ steps.jar.outputs.name }}.sha256

      - name: Create GitHub release and attach JAR
        uses: softprops/action-gh-release@v2
        with:
          name: "stminecraft ${{ github.ref_name }}"
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.jar.outputs.path }}
            ${{ steps.jar.outputs.name }}.sha256
